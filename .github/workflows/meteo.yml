name: Météo quotidienne
on:
  schedule:
    - cron: "17 4 * * *"   # chaque matin vers 6 h (heure de Paris)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: donnees, cancel-in-progress: false }
jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: PYTHONPATH=scripts python scripts/meteo.py
      - name: Publier
        run: |
          git config user.name "onddo-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/data/meteo.json
          git commit -m "Météo du $(date +%F)" || exit 0
          git pull --rebase && git push

name: Calage Iraty
on: { workflow_dispatch: {} }
permissions:
  contents: write
concurrency: { group: donnees, cancel-in-progress: false }
jobs:
  calage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: PYTHONPATH=scripts python scripts/calage.py | tee build/calage.txt
      - name: Enregistrer le résultat
        run: |
          git config user.name "onddo-bot"; git config user.email "actions@users.noreply.github.com"
          git add build/calage.txt
          git commit -m "Résultat du calage Iraty" || exit 0
          git pull --rebase && git push
